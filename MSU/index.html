<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bobcat Launchpad · MSU CompE Prep</title>
  <meta name="description" content="A personal tracking hub for an incoming Montana State University Computer Engineering freshman: checklists, timelines, deadlines, tools, and resources." />
  <!-- Unlisted page: keep it out of search engines. It isn't linked from the
       main portfolio, so it's reachable only by typing the URL directly. -->
  <meta name="robots" content="noindex, nofollow" />
  <!-- Emoji favicon, no external file needed -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎓</text></svg>" />
  <!-- Apply saved theme before paint to avoid a flash -->
  <script>try{var t=localStorage.getItem('bl_theme');if(t)document.documentElement.setAttribute('data-theme',JSON.parse(t));}catch(e){}</script>
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/components.css" />
</head>
<body>
  <a class="skip-link" href="#main">Skip to content</a>

  <!-- ───────────────── Header ───────────────── -->
  <header class="app-header">
    <div class="header-left">
      <button class="icon-btn menu-btn" id="menuBtn" aria-label="Toggle sidebar" title="Toggle sidebar">
        <span class="hamburger"></span>
      </button>
      <a class="brand" href="#/dashboard">
        <span class="brand-mark">🎓</span>
        <span class="brand-text">
          <span class="brand-title">Bobcat Launchpad</span>
          <span class="brand-sub">MSU · Computer Engineering · Fall 2026</span>
        </span>
      </a>
    </div>

    <div class="header-search">
      <span class="search-icon" aria-hidden="true">🔍</span>
      <input type="search" id="globalSearch" placeholder="Search everything…  (press /)" autocomplete="off" aria-label="Search all content" />
      <kbd class="search-kbd">/</kbd>
      <div class="search-results" id="searchResults" role="listbox" hidden></div>
    </div>

    <div class="header-right">
      <button class="icon-btn" id="themeBtn" aria-label="Change theme" title="Change theme" aria-haspopup="true">🎨</button>
      <div class="popover theme-popover" id="themePopover" hidden></div>
      <a class="icon-btn" href="#/settings" aria-label="Settings" title="Settings">⚙️</a>
    </div>
  </header>

  <!-- ───────────────── Body ───────────────── -->
  <div class="app-body">
    <aside class="sidebar" id="sidebar" aria-label="Primary navigation">
      <nav id="nav" class="nav"></nav>
      <div class="sidebar-footer">
        <div class="mini-progress" id="miniProgress" title="Overall progress"></div>
      </div>
    </aside>

    <div class="scrim" id="scrim" hidden></div>

    <main class="content" id="main" tabindex="-1"></main>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

  <!-- ───────────────── Scripts (classic, load-order matters) ───────────────── -->
  <script src="js/store.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/data/config.js"></script>
  <script src="js/data/dorm.js"></script>
  <script src="js/data/supplies.js"></script>
  <script src="js/data/tech.js"></script>
  <script src="js/data/clothing.js"></script>
  <script src="js/data/academics.js"></script>
  <script src="js/data/onboarding.js"></script>
  <script src="js/data/timeline.js"></script>
  <script src="js/data/discounts.js"></script>
  <script src="js/data/resources.js"></script>
  <script src="js/data/life.js"></script>
  <script src="js/data/certs.js"></script>
  <script src="js/data/finances.js"></script>
  <script src="js/render.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
